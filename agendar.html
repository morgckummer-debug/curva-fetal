<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://ulcqnqwxguydrpoaplcv.supabase.co; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Acompanhamento Fetal MK">
<meta property="og:title" content="Acompanhamento Fetal MK">
<meta property="og:description" content="Escolha as datas dos seus próximos ultrassons · Dra. Morgana Kummer">
<meta property="og:image" content="https://morgckummer-debug.github.io/curva-fetal/hero-logo.png">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="400">
<meta property="og:url" content="https://morgckummer-debug.github.io/curva-fetal/agendar.html">
<meta name="description" content="Escolha as datas dos seus próximos ultrassons · Dra. Morgana Kummer">
<title>Acompanhamento Fetal MK</title>
<link rel="icon" href="favicon-32.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4eef7;color:#2b2233;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.top{text-align:center;padding:10px 0 18px}
.top b{display:block;font-size:19px;color:#4b2a6b}
.top span{font-size:13px;color:#7a6a88}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(75,42,107,.08)}
h1{font-size:21px;margin:0 0 6px;color:#4b2a6b}
h2{font-size:17px;margin:0 0 2px;color:#4b2a6b}
.jan{font-size:14px;color:#7a6a88;margin-bottom:10px}
.lin{display:flex;gap:8px;margin-bottom:8px}
.lin select,textarea{font:inherit;padding:11px 10px;border:1px solid #cdbfd8;border-radius:10px;background:#fff;color:inherit;min-width:0}
.lin select{flex:1}.lin select:first-child{flex:1.6}
textarea{width:100%;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;width:100%;background:#4b2a6b;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
.err{color:#b3261e;font-size:14px;margin:8px 0}
.ok{text-align:center;padding:10px 0}
.ok .t{font-size:40px}
.res{font-size:15px;margin:6px 0}
.sec{background:none;color:#4b2a6b;border:1px solid #4b2a6b;margin-top:10px}
small{color:#7a6a88}
</style>
</head>
<body>
<div class="w">
  <div class="top"><b>Acompanhamento Fetal MK</b><span>Dra. Morgana Kummer</span></div>
  <div id="app"><div class="card">Carregando…</div></div>
</div>
<script>
(function () {
  var URL_ = 'https://ulcqnqwxguydrpoaplcv.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY3FucXd4Z3V5ZHJwb2FwbGN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Njk2NjcsImV4cCI6MjEwMTA0NTY2N30.hNrszyJvaBzP08Oild4wivMrTvXnDoGfgL6My1bbtVU';
  var app = document.getElementById('app');
  var tok = (new URLSearchParams(location.search).get('t') || '').trim();
  var dados = null;

  function rpc(fn, body) {
    return fetch(URL_ + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'erro'); return j; }); });
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fmt(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function fmtLongo(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4); }
  var SEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  function ehSabado(iso) { return new Date(iso + 'T12:00:00Z').getUTCDay() === 6; }
  function fmtDia(iso) { var d = new Date(iso + 'T12:00:00Z'); return SEM[d.getUTCDay()] + ', ' + fmtLongo(iso) + (ehSabado(iso) ? ' (até 12h)' : ''); }
  function diasEntre(de, ate) {
    var out = [], d = new Date(de + 'T12:00:00Z'), fim = new Date(ate + 'T12:00:00Z');
    while (d <= fim && out.length < 120) {
      var iso = d.toISOString().slice(0, 10);
      if (d.getUTCDay() !== 0 && !bloqueado(iso)) out.push(iso); // a clínica não abre aos domingos nem nos dias de ausência da médica
      d.setUTCDate(d.getUTCDate() + 1);
    }
    return out;
  }
  function bloqueado(iso) {
    var b = (dados && dados.bloqueados) || [];
    for (var i = 0; i < b.length; i++) if (iso >= b[i].de && iso <= b[i].ate) return true;
    return false;
  }
  var PER = { qualquer: 'qualquer horário', manha: 'manhã', tarde: 'tarde' };
  function limpa() { while (app.firstChild) app.removeChild(app.firstChild); }

  function invalido() {
    limpa();
    var c = el('div', 'card');
    c.appendChild(el('h1', null, 'Link não encontrado'));
    c.appendChild(el('p', null, 'Este link não é mais válido. Fale com a nossa equipe pelo WhatsApp e enviaremos um novo 💜'));
    app.appendChild(c);
  }

  function resumo(resp) {
    var c = el('div', 'card');
    c.appendChild(el('h1', null, 'Recebemos suas datas 💜'));
    c.appendChild(el('p', null, 'Nossa equipe vai conferir a agenda e confirmar com você pelo WhatsApp.'));
    resp.prefs.forEach(function (p) {
      var d = el('div', 'res');
      d.appendChild(el('b', null, p.n));
      p.datas.slice(0, 1).forEach(function (x) { d.appendChild(el('div', null, fmtLongo(x.d) + ' · ' + PER[x.p])); });
      c.appendChild(d);
    });
    if (resp.obs) c.appendChild(el('p', 'res', 'Observação: ' + resp.obs));
    var b = el('button', 'sec', 'Quero alterar minha escolha');
    b.onclick = function () { form(); };
    c.appendChild(b);
    limpa(); app.appendChild(c);
  }

  function agendados(d) {
    limpa(); var c = el('div', 'card');
    var lista = d.agendados && d.agendados.length ? d.agendados : null;
    var nm = d.nome ? ', ' + d.nome : '';
    c.appendChild(el('h1', null, lista ? (d.confirmada ? 'Presença confirmada' + nm + ' 💜' : 'Confira seus horários' + nm) : 'Seus ultrassons já estão agendados' + nm + ' 💜'));
    if (!lista) { c.appendChild(el('p', null, 'A nossa equipe enviou a confirmação pelo WhatsApp. Qualquer dúvida, é só responder lá.')); app.appendChild(c); return; }
    lista.forEach(function (x) {
      var r = el('div', 'res');
      r.appendChild(el('b', null, x.n));
      r.appendChild(el('div', null, fmtDia(x.d) + (x.h ? ' · às ' + x.h.slice(0, 2) + 'h' + (x.h.slice(3, 5) !== '00' ? x.h.slice(3, 5) : '') : '')));
      c.appendChild(r);
    });
    if (d.confirmada) {
      c.appendChild(el('p', null, 'Obrigada por confirmar! Será um prazer receber você e acompanhar de perto cada fase da sua gestação. Até breve! 💜'));
      c.appendChild(el('p', null, 'Se precisar remarcar, avise com 48 horas de antecedência pelo WhatsApp.'));
    } else {
      var er = el('p', 'res', '');
      var b = el('button', null, 'Confirmo');
      b.onclick = function () {
        b.disabled = true; b.textContent = 'Enviando…';
        rpc('agenda_confirmar', { p_token: tok }).then(function (ok) {
          if (!ok) throw new Error('x');
          return rpc('agenda_publica', { p_token: tok }).then(function (n) { agendados(n); });
        }).catch(function () { b.disabled = false; b.textContent = 'Confirmo'; er.textContent = 'Não consegui enviar agora. Tente de novo ou responda pelo WhatsApp.'; });
      };
      c.appendChild(b); c.appendChild(er);
    }
    app.appendChild(c);
  }

  function form() {
    limpa();
    var head = el('div', 'card');
    head.appendChild(el('h1', null, 'Olá, ' + (dados.nome || '') + '!'));
    head.appendChild(el('p', null, 'Escolha o dia de sua preferência para cada ultrassom, dentro do período indicado. Vamos confirmar com você pelo WhatsApp 🥰'));
    app.appendChild(head);
    var blocos = [];
    dados.exames.forEach(function (ex) {
      var c = el('div', 'card');
      c.appendChild(el('h2', null, ex.n));
      c.appendChild(el('div', 'jan', 'Entre ' + fmtLongo(ex.de) + ' e ' + fmtLongo(ex.ate)));
      var linhas = [];
      for (var k = 0; k < 1; k++) {
        var l = el('div', 'lin');
        var inp = document.createElement('select');
        inp.setAttribute('aria-label', 'Dia de ' + ex.n);
        var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'Escolha o dia'; inp.appendChild(o0);
        var dias = diasEntre(ex.de, ex.ate);
        if (!dias.length) o0.textContent = 'Sem dias livres neste período';
        dias.forEach(function (iso) {
          var o = document.createElement('option'); o.value = iso; o.textContent = fmtDia(iso); inp.appendChild(o);
        });
        var sel = document.createElement('select');
        [['qualquer', 'Qualquer horário'], ['manha', 'Manhã'], ['tarde', 'Tarde']].forEach(function (o) {
          var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; sel.appendChild(op);
        });
        // sábado a clínica funciona só até 12h: só manhã
        inp.addEventListener('change', function () {
          var sab = inp.value && ehSabado(inp.value);
          if (sab) sel.value = 'manha';
          Array.prototype.forEach.call(sel.options, function (o) { o.disabled = sab && o.value === 'tarde'; });
        });
        l.appendChild(inp); l.appendChild(sel); c.appendChild(l);
        linhas.push({ inp: inp, sel: sel });
      }
      if (!dias.length) c.appendChild(el('p', 'res', 'Neste período não há dias de atendimento. Fale com a nossa equipe pelo WhatsApp que encontramos uma data para você.'));
      if (dados.resposta) {
        var antes = dados.resposta.prefs.filter(function (p) { return p.key === ex.key; })[0];
        if (antes) antes.datas.forEach(function (x, k) { if (linhas[k]) { linhas[k].inp.value = x.d; linhas[k].inp.dispatchEvent(new Event('change')); linhas[k].sel.value = x.p; } });
      }
      app.appendChild(c);
      blocos.push({ ex: ex, linhas: linhas });
    });
    var co = el('div', 'card');
    co.appendChild(el('small', null, 'Observação (opcional)'));
    var ta = document.createElement('textarea'); ta.rows = 3; ta.maxLength = 300;
    ta.placeholder = 'Ex.: só consigo à tarde, trabalho até as 17h…';
    if (dados.resposta && dados.resposta.obs) ta.value = dados.resposta.obs;
    co.appendChild(ta);
    var er = el('div', 'err'); co.appendChild(er);
    var bt = el('button', null, 'Enviar minhas datas');
    bt.onclick = function () {
      er.textContent = '';
      var prefs = [];
      for (var i = 0; i < blocos.length; i++) {
        var datas = [], vistos = {};
        blocos[i].linhas.forEach(function (l) {
          var v = l.inp.value;
          if (v && !vistos[v]) { vistos[v] = 1; datas.push({ d: v, p: l.sel.value }); }
        });
        if (!datas.length && !blocos[i].linhas[0].inp.options[1]) continue; // período sem dia livre: a equipe resolve pelo WhatsApp
        if (!datas.length) { er.textContent = 'Escolha uma data para: ' + blocos[i].ex.n + '.'; return; }
        for (var j = 0; j < datas.length; j++) {
          if (datas[j].d < blocos[i].ex.de || datas[j].d > blocos[i].ex.ate) { er.textContent = 'Há uma data fora do período de ' + blocos[i].ex.n + '.'; return; }
        }
        prefs.push({ key: blocos[i].ex.key, datas: datas });
      }
      if (!prefs.length) { er.textContent = 'Não há dias livres para escolher. Fale com a nossa equipe pelo WhatsApp.'; return; }
      bt.disabled = true; bt.textContent = 'Enviando…';
      rpc('agenda_responder', { p_token: tok, p_prefs: prefs, p_obs: ta.value }).then(function (ok) {
        if (!ok) return invalido();
        return rpc('agenda_publica', { p_token: tok }).then(function (d) { dados = d; resumo(d.resposta); });
      }).catch(function () {
        bt.disabled = false; bt.textContent = 'Enviar minhas datas';
        er.textContent = 'Não consegui enviar agora. Confira sua internet e tente de novo, ou responda pelo WhatsApp.';
      });
    };
    co.appendChild(bt);
    app.appendChild(co);
  }

  if (tok.length < 32) { invalido(); return; }
  rpc('agenda_publica', { p_token: tok }).then(function (d) {
    if (!d) return invalido();
    dados = d;
    if (d.agendado && !d.resposta) { agendados(d); return; }
    if (d.resposta) resumo(d.resposta); else form();
  }).catch(function () {
    limpa(); var c = el('div', 'card');
    c.appendChild(el('p', null, 'Não consegui carregar agora. Tente de novo em instantes.'));
    app.appendChild(c);
  });
})();
</script>
</body>
</html>
