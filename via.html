<style>
body{margin:0;background:#f4eef7;color:#2b2233;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
.w{max-width:520px;margin:0 auto;padding:40px 16px;text-align:center}
.card{background:#fff;border-radius:16px;padding:22px 18px;box-shadow:0 2px 10px rgba(75,42,107,.08)}
b{color:#4b2a6b}
</style>
</head>
<body>
<div class="w"><div class="card" id="msg">Carregando a sua via…</div></div>
<script>
// Via da gestante do contrato (link mandado pela recepção no WhatsApp). Mostra só o documento
// daquele link (via_publica, migração 042). O documento é escrito no lugar desta página, com uma
// barra para salvar em PDF / imprimir que não sai no papel.
(function () {
  var URL_ = 'https://ulcqnqwxguydrpoaplcv.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsY3FucXd4Z3V5ZHJwb2FwbGN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Njk2NjcsImV4cCI6MjEwMTA0NTY2N30.hNrszyJvaBzP08Oild4wivMrTvXnDoGfgL6My1bbtVU';
  var tok = (new URLSearchParams(location.search).get('t') || '').trim();
  var msg = document.getElementById('msg');
  function erro(t) { msg.innerHTML = ''; var p = document.createElement('div'); p.textContent = t; msg.appendChild(p); }
  if (!tok) { erro('Link incompleto. Peça um novo link à recepção da clínica.'); return; }
  fetch(URL_ + '/rest/v1/rpc/via_publica', {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: tok })
  }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'erro'); return j; }); })
    .then(function (d) {
      if (!d || !d.html) { erro('Este link não está mais disponível. Peça um novo link à recepção da clínica.'); return; }
      var barra = '<style>.via-barra{position:sticky;top:0;z-index:9;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px;background:#4b2a6b;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}'
        + '.via-barra button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 16px;background:#fff;color:#4b2a6b;cursor:pointer}'
        + '@media print{.via-barra{display:none!important}}</style>'
        + '<div class="via-barra"><span>Sua via ' + (/^Termo/.test(d.nome || '') ? 'do termo aditivo' : 'do contrato') + ' · Acompanhamento Fetal MK</span>'
        + '<button type="button" onclick="window.print()">Salvar em PDF / imprimir</button></div>';
      var html = String(d.html);
      if (!/name="viewport"/.test(html)) html = html.replace(/<head>/i, '<head><meta name="viewport" content="width=device-width, initial-scale=1">');
      html = /<body[^>]*>/i.test(html) ? html.replace(/<body[^>]*>/i, function (m) { return m + barra; }) : barra + html;
      document.open(); document.write(html); document.close();
    })
    .catch(function () { erro('Não consegui abrir agora. Verifique a internet e tente de novo.'); });
})();
</script>
</body>
</html>
